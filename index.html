                    >

                    </button>

            }).join('');

                            ${item.title}
                        </span>
                        <span class="text-rust-light ml-3 flex-shrink-0 transition-transform duration-300" id="icon-${item.id}">
                            <!-- Chevron Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </span>
                    </button>

                    <!-- Accordion Body (Hidden by default) -->
                    <div id="content-${item.id}" class="hidden bg-white">
                        <div class="px-5 pb-6 pt-2">
                            <!-- Image -->
                            <div class="mb-4 rounded-lg overflow-hidden bg-gray-100 border border-stone-border/50">
                                <img 
                                    src="${item.imageUrl}" 
                                    alt="${item.title}" 
                                    class="w-full h-auto object-cover max-h-[400px]"
                                    loading="lazy"
                                >
                            </div>

                            <!-- Description -->
                            <p class="text-sm leading-relaxed text-gray-600 mb-5 font-sans">
                                ${item.description}
                            </p>

                            <!-- Audio Player -->
                            

<div class="bg-paper p-4 rounded-lg border border-stone-border space-y-4">
                                <div class="flex items-center space-x-2 mb-3 border-b border-stone-border/50 pb-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-rust" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                                    </svg>
                                    <span class="text-xs font-bold text-rust uppercase tracking-wider">语音导览 (Audio Guide)</span>
                                </div>

                                ${
                                    // 1. 确保它是数组
                                    (Array.isArray(item.audioUrl) ? item.audioUrl : [item.audioUrl]).map((url, i, arr) => {
                                        
                                        // 2. 生成“身份证号”：比如 audio-1-1-0 (作品ID-第几段)
                                        const currentId = `audio-${item.id}-${i}`;
                                        const nextId = `audio-${item.id}-${i + 1}`;
                                        
                                        // 3. 判断有没有下一首
                                        const hasNext = i < arr.length - 1;

                                        // 4. 核心逻辑：如果不止一首，且不是最后一首，就生成“自动播放下一首”的指令
                                        // 指令意思：当这个播完(onended)，去找下一个ID，然后 play()
                                        const autoPlayLogic = hasNext 
                                            ? `document.getElementById('${nextId}').play()` 
                                            : '';

                                        return `
                                        <div class="bg-white/50 rounded p-2 transition-all hover:bg-white border border-transparent hover:border-stone-border/30">
                                            <div class="text-[10px] text-gray-500 font-medium mb-1 ml-1 flex justify-between">
                                                <span>第 ${i + 1} 部分</span>
                                                <span class="opacity-50">${i + 1} / ${arr.length}</span>
                                            </div>
                                            
                                            <audio 
                                                id="${currentId}"
                                                controls 
                                                preload="metadata"
                                                class="w-full h-8"
                                                src="${url}"
                                                onended="${autoPlayLogic}"
                                            ></audio>
                                        </div>
                                        `;
                                    }).join('')
                                }
                            </div>

                        </div>
                    </div>
                </div>
            `).join('');

            html += `</div>
                <div class="text-center mt-12 mb-8 text-gray-400 text-sm">
                    <p>— End of ${unit.title} —</p>
                </div>
            `;

            mainContent.innerHTML = html;
        }

        // ==========================================
        // 5. INTERACTION FUNCTIONS
        // ==========================================

        /**
         * Switches the active unit, updates UI, and scrolls to top.
         */
        function switchUnit(id) {
            if (activeUnitId === id) return;
            activeUnitId = id;
            renderNav();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /**
         * Toggles the accordion state for a specific item.
         */
        function toggleAccordion(itemId) {
            const content = document.getElementById(`content-${itemId}`);
            const icon = document.getElementById(`icon-${itemId}`);
            const title = document.getElementById(`title-${itemId}`);
            const btn = document.getElementById(`btn-${itemId}`);
            
            const isHidden = content.classList.contains('hidden');

            if (isHidden) {
                // Open
                content.classList.remove('hidden');
                icon.classList.add('rotate-180', 'text-rust');
                icon.classList.remove('text-rust-light');
                title.classList.add('text-rust', 'font-bold');
                title.classList.remove('text-ink', 'font-medium');
                btn.setAttribute('aria-expanded', 'true');
            } else {
                // Close
                content.classList.add('hidden');
                icon.classList.remove('rotate-180', 'text-rust');
                icon.classList.add('text-rust-light');
                title.classList.remove('text-rust', 'font-bold');
                title.classList.add('text-ink', 'font-medium');
                btn.setAttribute('aria-expanded', 'false');
                
                // Optional: Pause audio when closing
                const audio = content.querySelector('audio');
                if (audio) audio.pause();
            }
        }

        // ==========================================
        // 6. INITIALIZATION
        // ==========================================
        (function init() {
            renderNav();
            renderContent();
        })();


// === 终极防错版自动播放 JS ===
function playNextPartSelf(player) {
    // 1. 从标签里取出播放列表
    const playlist = JSON.parse(player.getAttribute('data-playlist'));
    
    // 2. 获取当前播到第几段
    let part = parseInt(player.getAttribute('data-part')) || 0;

    // 3. 如果还有下一段
    if (part < playlist.length - 1) {
        part++; 
        player.src = playlist[part]; // 切换链接
        player.setAttribute('data-part', part); // 更新标记
        player.play(); // 继续播放
    }
}

    </script>
</body>
